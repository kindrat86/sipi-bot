name: Tests

# Runs the full unit-test suite on every push and pull request. The 31
# regression tests in tests/ cover the paths that matter (tenant isolation,
# auth fail-closed, webhook idempotency, input validation, rate-limit bypass,
# compression). Before this gate existed a failing test could ship to prod
# because nothing enforced the green suite — only the JSON-LD lint ran in CI.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches requires-python in pyproject.toml and the Dockerfile base.
          python-version: "3.11"
          cache: pip
      - name: Install package + optional deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp]"
      - name: Run tests
        # Verbose + fail-fast on first error. unittest is stdlib, so no test
        # runner dependency is needed.
        run: python -m unittest discover -s tests -v
